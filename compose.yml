services:
  app:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: sqlite:///app/data/portfolio.db
      PUBLIC_ORIGIN: http://localhost:3000
      SESSION_COOKIE_SECURE: "false"
    volumes:
      - portfolio-data:/app/data
    init: true
    restart: unless-stopped
volumes:
  portfolio-data:
