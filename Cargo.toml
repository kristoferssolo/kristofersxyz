[package]
name = "kristofersxyz"
version = "0.1.0"
authors = ["Kristofers Solo <dev@kristofers.xyz>"]
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8", features = ["nightly"] }
leptos_router = { version = "0.8", features = ["nightly"] }
lucide-leptos = { version = "3.34", features = [
  "account",
  "arrows",
  "layout",
  "mail",
  "math",
  "navigation",
  "shapes",
] }
axum = { version = "0.8", optional = true }
axum-login = { version = "0.18", default-features = false, optional = true }
http-body-util = { version = "0.1", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
leptos_axum = { version = "0.8", optional = true }
leptos_meta = { version = "0.8" }
pulldown-cmark = "0.13"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "time",
], optional = true }
wasm-bindgen = { version = "0.2.106", optional = true }
web-sys = { version = "0.3", features = ["DataTransfer"] }
sqlx = { version = "0.9", features = [
  "runtime-tokio",
  "macros",
  "sqlite",
  "migrate",
], optional = true }
serde = { version = "1.0", features = ["derive"] }
unicode-segmentation = "1"
config = { version = "0.15", default-features = false, features = [
  "toml",
], optional = true }
criterion = { version = "0.8", optional = true }
dotenvy = { version = "0.15", optional = true }
thiserror = "2.0"
async-trait = { version = "0.1", optional = true }
serde_json = { version = "1", optional = true }
password-auth = { version = "1", optional = true }
rpassword = { version = "7", optional = true }
secrecy = { version = "0.10", features = ["serde"], optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "registry",
  "env-filter",
], optional = true }
tracing-log = { version = "0.2", optional = true }
tower-sessions = { version = "0.14", optional = true }
time = { version = "0.3", optional = true }

[features]
benchmarks = ["dep:criterion"]
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook", "dep:wasm-bindgen"]
ssr = [
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "dep:axum",
  "dep:axum-login",
  "dep:http-body-util",
  "dep:leptos_axum",
  "dep:async-trait",
  "dep:config",
  "dep:dotenvy",
  "dep:password-auth",
  "dep:rpassword",
  "dep:secrecy",
  "dep:serde_json",
  "dep:sqlx",
  "dep:time",
  "dep:tokio",
  "dep:tower-sessions",
  "dep:tracing-log",
  "dep:tracing-subscriber",
  "dep:uuid",
]

[dev-dependencies]
claims = "0.8"
rstest = "0.26"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "authentication"
harness = false
required-features = ["ssr", "benchmarks"]

[lints.clippy]
# `#[component]` expands to an empty builder-marker enum per component.
empty_enums = "allow"
large_futures = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
# The name used by wasm-bindgen/cargo-leptos for the JS/WASM bundle. Defaults to the crate name
output-name = "kristofersxyz"

# The site root folder is where cargo-leptos generate all output. WARNING: all content of this folder will be erased on a rebuild. Use it in your server setup.
site-root = "target/site"

# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
# Defaults to pkg
site-pkg-dir = "pkg"

# [Optional] The Tailwind CSS source file. Cargo Leptos compiles it into <site-root>/<site-pkg>/kristofersxyz.css.
tailwind-input-file = "style/main.css"
# Assets source dir. All files found here will be copied and synchronized to site-root.
# The assets-dir cannot have a sub directory with the same name/path as site-pkg-dir.
#
# Optional. Env: LEPTOS_ASSETS_DIR.
assets-dir = "public"

# The IP and port (ex: 127.0.0.1:3000) where the server serves the content. Use it in your server setup.
site-addr = "127.0.0.1:3000"

# The port to use for automatic reload monitoring
reload-port = 3001

# [Optional] Command to use when running end2end tests. It will run in the end2end dir.
#   [Windows] for non-WSL use "npx.cmd playwright test"
#   This binary name can be checked in Powershell with Get-Command npx
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"

#  The browserlist query used for optimizing the CSS.
browserquery = "defaults"

# The features to use when compiling the bin target
#
# Optional. Can be over-ridden with the command line parameter --bin-features
bin-features = ["ssr"]

# If the --no-default-features flag should be used when compiling the bin target
#
# Optional. Defaults to false.
bin-default-features = false

# The features to use when compiling the lib target
#
# Optional. Can be over-ridden with the command line parameter --lib-features
lib-features = ["hydrate"]

# If the --no-default-features flag should be used when compiling the lib target
#
# Optional. Defaults to false.
lib-default-features = false

# The profile to use for the lib target when compiling for release
#
# Optional. Defaults to "release".
lib-profile-release = "wasm-release"
